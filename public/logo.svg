<?xml version="1.0" encoding="UTF-8"?>
<!--
  Ace the CSE 主 Logo — 「博」字 + 朱砂方印
  Imperial Scroll 主题：墨蓝底 #1e3a5f + 印章红 #c1272d
  设计哲学锚：公考卷面气质 = 中文 display + 印章
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Ace the CSE 博 logo">
  <!-- 墨蓝渐变底（与 .gradient-mo-blue 同源） -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2942" />
      <stop offset="60%" stop-color="#1e3a5f" />
      <stop offset="100%" stop-color="#2c5282" />
    </linearGradient>
    <!-- 朱砂方印渐变 -->
    <linearGradient id="seal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c1272d" />
      <stop offset="100%" stop-color="#7c1d1d" />
    </linearGradient>
  </defs>
  <!-- 圆角方块底 -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#bg)" />
  <!-- 主字「博」白色，居中略偏上为印章留位 -->
  <text x="256" y="316" font-family="'LXGW WenKai','LXGW WenKai Screen','Source Han Serif SC','Noto Serif SC','PingFang SC',serif"
        font-size="288" font-weight="bold" fill="#ffffff"
        text-anchor="middle" dominant-baseline="middle">博</text>
  <!-- 右下角朱砂方印 -->
  <g transform="translate(372,372)">
    <rect x="0" y="0" width="92" height="92" rx="6" fill="url(#seal)" />
    <text x="46" y="62" font-family="'LXGW WenKai','PingFang SC',serif"
          font-size="64" font-weight="bold" fill="#ffffff"
          text-anchor="middle">考</text>
  </g>
</svg>
