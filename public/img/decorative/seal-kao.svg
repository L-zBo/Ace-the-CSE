<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="考 字篆体水印">
  <defs>
    <filter id="kao-erosion" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="5" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3"/>
    </filter>
  </defs>

  <!-- 圆形描边底（无填充，作背景水印用） -->
  <g filter="url(#kao-erosion)">
    <circle cx="100" cy="100" r="88" fill="none" stroke="#c1272d" stroke-width="4" opacity="0.7"/>
    <circle cx="100" cy="100" r="80" fill="none" stroke="#c1272d" stroke-width="1.5" opacity="0.5"/>
  </g>

  <text
    x="100" y="100"
    font-family="'LXGW WenKai', 'Source Han Serif SC', 'Noto Serif SC', serif"
    font-size="120"
    font-weight="700"
    fill="#c1272d"
    fill-opacity="0.85"
    text-anchor="middle"
    dominant-baseline="central"
    filter="url(#kao-erosion)">考</text>
</svg>
