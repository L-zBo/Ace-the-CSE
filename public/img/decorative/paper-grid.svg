<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="卷面网格纹理（稿纸感）" preserveAspectRatio="none">
  <defs>
    <pattern id="paper-grid-pattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <!-- 主要横线（每 40px）- 模拟稿纸行 -->
      <line x1="0" y1="0" x2="40" y2="0" stroke="#0c1d30" stroke-width="0.5" stroke-opacity="0.06"/>
      <!-- 次要竖线（每 40px）- 卷面竖向节奏 -->
      <line x1="0" y1="0" x2="0" y2="40" stroke="#0c1d30" stroke-width="0.5" stroke-opacity="0.04"/>
      <!-- 中线点（卷面"中缝"暗示） -->
      <circle cx="20" cy="20" r="0.4" fill="#0c1d30" fill-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#paper-grid-pattern)"/>
</svg>
