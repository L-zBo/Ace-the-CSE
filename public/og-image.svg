<?xml version="1.0" encoding="UTF-8"?>
<!--
  og-image 1200×630 — Ace the CSE 分享卡
  Imperial Scroll 主题：墨蓝 + 朱砂印
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Ace the CSE 分享卡">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2942" />
      <stop offset="60%" stop-color="#1e3a5f" />
      <stop offset="100%" stop-color="#2c5282" />
    </linearGradient>
    <linearGradient id="seal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c1272d" />
      <stop offset="100%" stop-color="#7c1d1d" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="630" fill="url(#bg)" />

  <!-- 大「博」字水印（左下虚化） -->
  <text x="100" y="600" font-family="'LXGW WenKai','Source Han Serif SC',serif"
        font-size="640" font-weight="bold" fill="#ffffff" fill-opacity="0.06"
        text-anchor="start">博</text>

  <!-- Logo 方块 -->
  <g transform="translate(90,90)">
    <rect x="0" y="0" width="120" height="120" rx="24" fill="url(#seal)" />
    <text x="60" y="92" font-family="ui-sans-serif,system-ui,sans-serif"
          font-size="60" font-weight="900" fill="#ffffff"
          text-anchor="middle">Bo</text>
  </g>

  <!-- 主标题 -->
  <text x="240" y="160" font-family="ui-sans-serif,system-ui,sans-serif"
        font-size="56" font-weight="bold" fill="#ffffff">Ace the CSE</text>
  <text x="240" y="210" font-family="'LXGW WenKai','PingFang SC',serif"
        font-size="28" fill="#cbd5e1">公务员考试全功能学习平台</text>

  <!-- 主标语 -->
  <text x="90" y="370" font-family="'LXGW WenKai','Source Han Serif SC',serif"
        font-size="84" font-weight="bold" fill="#ffffff">行测 · 申论 · 历年真题</text>

  <!-- 分割线 -->
  <line x1="90" y1="420" x2="320" y2="420" stroke="#c1272d" stroke-width="4" />

  <!-- 副标签 -->
  <text x="90" y="475" font-family="'LXGW WenKai','PingFang SC',serif"
        font-size="32" fill="#94a3b8">国考 · 省考 · 事业编联考</text>

  <!-- 右下朱砂印 -->
  <g transform="translate(1010,470)">
    <rect x="0" y="0" width="120" height="120" rx="8" fill="url(#seal)" />
    <text x="60" y="48" font-family="'LXGW WenKai','PingFang SC',serif"
          font-size="44" font-weight="bold" fill="#ffffff"
          text-anchor="middle">公</text>
    <text x="60" y="98" font-family="'LXGW WenKai','PingFang SC',serif"
          font-size="44" font-weight="bold" fill="#ffffff"
          text-anchor="middle">考</text>
  </g>
</svg>
